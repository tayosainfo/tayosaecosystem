name: tayosa_mobile
description: TAYOSA FinTech Super-App - Mobile Client
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.0
  go_router: ^14.0.0
  dio: ^5.4.0
  local_auth: ^2.2.0
  flutter_secure_storage: ^9.2.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  firebase_core: ^3.0.0
  firebase_messaging: ^15.0.0
  lucide_icons: ^0.257.0
  google_fonts: ^6.1.0
  shared_preferences: ^2.5.5
  lottie: ^3.3.3
  supabase_flutter: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.0
  hive_generator: ^2.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - assets/data/ugandaGeoData.json
    - assets/images/logo.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/images/logo.png"

flutter_native_splash:
  color: "#0B1120"
  image: "assets/images/logo.png"
  android: true
  ios: false